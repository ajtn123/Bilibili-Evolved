name: Dashboard Home Preview

on:
  push:
    branches:
      - codex/dashboard-home-preview
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dashboard-home-preview
  cancel-in-progress: false

env:
  SOURCE_BRANCH: codex/dashboard-home
  PREVIEW_BRANCH: codex/dashboard-home-preview
  BUNDLE_PATH: registry/dist/components/style/home-redesign/dashboard.js
  PUBLISH_BRANCH: codex/dashboard-home-preview-dist

jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/dashboard-home-preview'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
      - name: Select preview commit
        id: revision
        shell: bash
        run: |
          preview_sha="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            source_ref="refs/heads/$SOURCE_BRANCH"
            preview_ref="refs/heads/$PREVIEW_BRANCH"
            source_tracking="refs/remotes/origin/$SOURCE_BRANCH"
            preview_tracking="refs/remotes/origin/$PREVIEW_BRANCH"
            git fetch --no-tags origin "+$source_ref:$source_tracking" "+$preview_ref:$preview_tracking"

            source_sha=$(git rev-parse "$source_tracking")
            preview_sha=$(git rev-parse "$preview_tracking")
            setup_commit=$(git log -1 --first-parent --diff-filter=A --format=%H \
              "$preview_sha" -- .github/workflows/dashboard-home-preview.yml)
            if [[ -z "$setup_commit" ]]; then
              echo "::error::The preview workflow commit was not found on $PREVIEW_BRANCH."
              exit 1
            fi
            preview_base=$(git rev-parse "$setup_commit^")

            if [[ "$preview_base" != "$source_sha" ]]; then
              # Replay preview-only commits, even if the source branch was rewritten.
              git switch --detach "$preview_sha"
              git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                rebase --onto "$source_sha" "$preview_base"
              git push --force-with-lease="$preview_ref:$preview_sha" origin "HEAD:$preview_ref"
              preview_sha=$(git rev-parse HEAD)
            fi
          fi
          printf 'commit=%s\n' "$preview_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir registry install --frozen-lockfile
      - name: Build Dashboard Home
        run: |
          pnpm exec tsx -e '
            import { webpack } from "webpack"
            import { buildByEntry } from "./registry/webpack/config"

            const src = "./registry/lib/components/"
            const config = buildByEntry({
              src,
              type: "component",
              entry: src + "style/home-redesign/dashboard/index.ts",
            })
            webpack(config, (error, stats) => {
              if (error) {
                console.error(error)
                process.exitCode = 1
                return
              }
              console.log(stats?.toString({ preset: "errors-warnings" }))
              process.exitCode = stats && !stats.hasErrors() ? 0 : 1
            })
          '
          mkdir -p "$RUNNER_TEMP/dashboard-home"
          sed '/^\/\/# sourceMappingURL=/d' "$BUNDLE_PATH" > "$RUNNER_TEMP/dashboard-home/dashboard.js"
          test -s "$RUNNER_TEMP/dashboard-home/dashboard.js"
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-home
          path: ${{ runner.temp }}/dashboard-home/dashboard.js
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-home
          path: ${{ runner.temp }}/dashboard-home
      - name: Publish component update
        env:
          BUILT_COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          latest=$(git ls-remote --exit-code origin "refs/heads/$PREVIEW_BRANCH" | cut -f1)
          if [[ "$latest" != "$BUILT_COMMIT" ]]; then
            echo "A newer preview commit is available."
            exit 0
          fi

          output_ref="refs/heads/$PUBLISH_BRANCH"
          if git ls-remote --exit-code origin "$output_ref" > /dev/null; then
            git fetch --depth=1 origin "$output_ref"
            git switch --detach FETCH_HEAD
          else
            status=$?
            if [[ "$status" != 2 ]]; then
              exit "$status"
            fi
            git switch --orphan "$PUBLISH_BRANCH"
          fi

          install -Dm644 "$RUNNER_TEMP/dashboard-home/dashboard.js" "$BUNDLE_PATH"
          git add -- "$BUNDLE_PATH"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Build Dashboard Home from ${BUILT_COMMIT::12}"
            git push origin "HEAD:$output_ref"
          fi

          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$PUBLISH_BRANCH/$BUNDLE_PATH"
          printf '[Dashboard Home component update URL](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
